<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Title</title>
    <script src="index.js" defer></script>
    <script src="craft.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="main-game">
        <div id="survivor">
            <div id="survivor-display">
                <h2>Survivor</h2>
                <img id="survivor-image" src="img.png" alt="Survivor"/>
                <label>Energy: <span id="energy-bar"></span></label>
            </div>

            <div id="resources">
                <label>Wood: <span id="wood"></span></label>
                <label>Vines: <span id="vines"></span></label>
                <label>Food: <span id="food"></span></label>
                <label>Stone: <span id="stone"></span></label>
            </div>

            <div id="survivor-inventory">
                <ul id="inventory-list">
                </ul>
            </div>

        </div>

        <div id="actions">
            <h2>Actions</h2>
            <div id="action-buttons">
                <button id="hunt-button">Hunt</button>
                <button id="gather-button">Gather</button>
                <button id="rest-button">Rest</button>
                <button id="sail-button">Sail Away</button>
            </div>
        </div>
        <div id="crafting">
            <h2>Crafting</h2>
            <div>
                <div id="crafting-display">
                    <div id="crafting-tool-info" hidden>
                        <div id="crafting-tool">
                            <h3 id="crafting-tool-title">Title</h3>
                            <p id="crafting-description">Description</p>
                            <ul id="crafting-requirements">
                            </ul>
                        </div>
                        <img id="crafting-tool-image"
                             src="https://res.cloudinary.com/dvwpcohmk/image/upload/v1770034535/SuperSpear_ttfpor.png"
                             alt="Tool Image"
                        >
                    </div>
                    <div id="crafting-actions">
                        <label for="craft-item-select">Item: </label><select id="craft-item-select"></select>
                        <button id="craft-button">Craft</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
