<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Title</title>

    <script type="module" src="./index.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="survivor.css">
</head>
<body>

    <div id="main-game">
        <div id="survivor">
            <div id="survivor-display">
                <h2>Survivor</h2>
                <img id="survivor-image" src="img.png" alt="Survivor"/>
                <label>Energy: <span id="energy-bar"></span></label>
            </div>

            <div id="survivor-inventory">
                <h2 id="inventory-title">Inventory</h2>
                <div id="inventory-acquired">
                    <div id="resources">
                        <label for="wood">Wood: <span id="wood"></span></label>
                        <label for="vine">Vines: <span id="vine"></span></label>
                        <label for="food">Food: <span id="food"></span></label>
                        <label for="stone">Stone: <span id="stone"></span></label>
                        <label for="obsidian">Obsidian: <span id="obsidian"></span></label>
                        <label for="rarefang">Rare Fang: <span id="rarefang"></span></label>
                    </div>
                    <ul id="inventory-list"></ul>
                </div>

            </div>

        </div>

        <div id="actions">
            <h2>Actions</h2>
            <div id="action-buttons">
                <button id="hunt-button">Hunt</button>
                <button id="gather-button">Gather</button>
                <button id="rest-button">Rest</button>
                <button id="sail-button">Sail Away</button>
            </div>
        </div>
        <div id="crafting">
            <h2>Crafting</h2>
            <div>
                <div id="crafting-display">
                    <div id="crafting-tool-info">
                        <div id="crafting-tool">
                            <h3 id="crafting-tool-title">Title</h3>
                            <p id="crafting-description">Description</p>
                            <ul id="crafting-requirements">
                            </ul>
                        </div>
                        <img id="crafting-tool-image"
                             src=""
                             alt="Tool Image"
                        >
                    </div>
                    <div id="crafting-actions">
                        <label for="craft-item-select">Item: </label><select id="craft-item-select"></select>
                        <button id="craft-button">Craft</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
